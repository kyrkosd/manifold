[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourier-manifold"
version = "0.1.0"
description = "Fourier Manifold Anomaly System (FMAS)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "faiss-cpu>=1.8",
    "networkx>=3.2",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools]
py-modules = ["pipeline", "config"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "anomaly*", "common*", "fourier*", "fourier_manifold*",
    "ingestion*", "manifold*", "reporting*", "structure*",
]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
